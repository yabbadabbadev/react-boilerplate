name: PR checks

on:
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Use Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Service worker matches the installed msw
        run: |
          installed="$(node -p "require('msw/package.json').version")"
          committed="$(sed -n "s/^const PACKAGE_VERSION = '\(.*\)'$/\1/p" public/mockServiceWorker.js)"
          installed_major="$(echo "$installed" | cut -d. -f1)"
          committed_major="$(echo "$committed" | cut -d. -f1)"
          if [ "$installed_major" != "$committed_major" ]; then
            echo "public/mockServiceWorker.js was generated by msw major $committed_major ($committed) but msw major $installed_major ($installed) is installed. Run: npx msw init public --save" >&2
            exit 1
          fi
          if [ "$installed" != "$committed" ]; then
            echo "Synchronizing public/mockServiceWorker.js from msw $committed to $installed for test run"
            npx msw init public --no-save
          fi

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test -- --run
